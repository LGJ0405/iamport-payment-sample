<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>신청 정보 입력</h2>
    <form id = 'frm'>
        <div><p>신청 점표명<br>
            <input type="text" name="text_code" size="40" placeholder="영수증에 있는 GS점포명을 입력해주세요">
        </p></div>
        <div style="color: red;" class="text_case">
        </div>
        <div><p>이름<br>
            <input type="text" name="text_name" size="40" placeholder="이름을 입력해 주세요">
        </p></div>
        <div style="color: red;" class="text_case">
        </div>
        <div><p>전화번호<br>
            <input type="text" name="tel_44" size="40" placeholder="전화번호를 입력해 주세요">
        </p></div>
        <div style="color: red;" class="text_case">
        </div>
        <div><p>상품종류<br>
            <select name="menu_order" style="width:315px;">
                <option value="고급형">고급형 SET</option>    
                <option value="실속형">실속형 SET</option>    
            </select>
        </p></div>
        <div><p>지역<br>
            <select name="menu_region" style="width:315px;">
                <option value="서울특별시">서울특별시</option>
                <option value="인천광역시">인천광역시</option>
                <option value="부산광역시">부산광역시</option>
                <option value="광주광역시">광주광역시</option>
                <option value="대전광역시">대전광역시</option>
                <option value="대구광역시">대구광역시</option>
                <option value="울산광역시">울산광역시</option>
                <option value="경기도">경기도</option>
                <option value="강원도">강원도</option>
                <option value="충청북도">충청북도</option>
                <option value="충청남도">충청남도</option>
                <option value="전라북도">전라북도</option>
                <option value="전라남도">전라남도</option>
                <option value="경상북도">경상북도</option>
                <option value="경상남도">경상남도</option>
                <option value="제주도">제주도</option>
                </select>
        </p></div>
        <div><p>
            &nbsp;<input type="checkbox" checked value="OK" onclick="check(this)">
            &nbsp;LED 접수 상담을 위해 개인정보 수집 및 이용에 동의함을 전제로 합니다.
            </p></div>
        <input type="button" value="LED 신청하기" onclick="Insert()" id = 'btn'>
        <br><br>
        <div class="text_case"></div>
    </form>
    <script>
        function Insert(){
            var count = 0;
            var text_case = document.querySelectorAll('.text_case');

            if(frm.text_code.value==""){
                text_case[0].innerHTML ='필수 입력 필드입니다.';
                count++;
            }else{
                text_case[0].innerHTML ='';
            }
            if(frm.text_name.value==""){
                text_case[1].innerHTML ='필수 입력 필드입니다.';
                count++;
            }else{
                text_case[1].innerHTML ='';
            }
            if(frm.tel_44.value==""){
                text_case[2].innerHTML ='필수 입력 필드입니다.';
                count++;
            }else{
                text_case[2].innerHTML ='';
            }
            if(count==0){/*
                frm.action = "customer_insert.jsp";
			    frm.submit();   */
                alert('XD');
                text_case[3].innerHTML ='';
            }else{
                text_case[3].innerHTML = count + '개의 입력란에 오류가 있습니다. 재확인 후 다시 시도하세요.';
            }
        }
        function check(box){
            const target = document.getElementById('btn');
            if(box.checked == true){
                target.disabled = false;
            }else{
                target.disabled = true;
            }
        }
    </script>
</body>
</html>
