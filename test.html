<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onload="BaseSet()">
    <form>
        <div class="Search_sort">
            <p class="Search_font1">가맹점코드</p>
            <p class="Search_font2">집계기준일자</p>
            <p style="margin-left: 8px;">신고일자</p>
        </div>
        <div class="Search_sort1">
            <!-- 가맹점코드 -->
            <div class="Search_search">
                <input type="text">
                <button type="button">검색<!--돋보기사진--></button>
            </div><br><br>
            <!-- 집계기준일자 -->
            <input type="date" class="Search_scale" id="rday" onchange="testday(term.value)"><br>
            <!-- 신고일자 -->
            <input type="text" class="Search_scale" id="start">
        </div>

        <div class="Search_sort">
            <p>가맹점명</p>
            <p>집계기간</p>
            <p>~</p>
        </div>
        <div class="Search_sort">
            <!-- 가맹점명 -->
            <div class="Search_search">
                <input type="text">
                <button type="button">검색<!--돋보기사진--></button>
            </div><br><br>

            <!-- 집계기간 -->
            <select class="Search_scale" onchange="testday(this.value)" id="term">
                <option value="day">일간집계</option>
                <option value="week">주간집계</option>
                <option value="mon">월간집계</option>
                <option value="quarter">분기집계</option>
                <option value="Hyear">반기집계</option>
                <option value="year">연간집계</option>
            </select><br>

            <!-- 신고일자 -->
            <input type="text" class="Search_scale" id="end">
        </div>

        <div class="Search_sort">
            <p class="Search_font1">사업자번호</p>
            <p style="margin-left: 8px;">가맹그룹</p>
        </div>
        <div class="Search_sort">
            <!-- 사업자번호 -->
            <div class="Search_search">
                <input type="text">
                <button type="button">검색<!--돋보기사진--></button>
            </div><br><br>

            <!-- 가맹그룹 -->
            <select class="Search_scale">
                <option>GS25</option>
                <option>CU</option>
                <option>미니스톱</option>
            </select><br>

            <!-- 초기화, 검색 -->
            <input type="button" class="Search_bt" id='reset' value="reset" onclick="BaseSet()">
            <input type="button" class="Search_btt" value="검색">
        </div>
    </form>
</body>
<script>
    let rdate = document.getElementById('rday');
    
    function BaseSet(){
        term.value = "week";
        rdate.valueAsDate = new Date();
        document.getElementById('end').value = rdate.value;
        start_day('week');
    }

    function testday(day){
        if(day=='quarter'||day=='Hyear'||day=='year'){
            start_mon(day);
        }else{
            end_day(day);
            start_day(day);
        }
    }

    function start_day(SD){
        var d = rdate.valueAsDate;
        if(SD=='week'){
            d.setDate(d.getDate() - 7);
        }else if(SD=='mon'){
            d.setDate(1);
        }
            let Mon = d.getMonth()+1;
                if(Mon<10){
                    Mon = '0'+Mon;
                }
            let day = d.getDate();
            if(day<10){
                day = '0'+day;
            }
        document.getElementById('start').value = d.getFullYear()+'-'+Mon+'-'+day;
    }
    function end_day(ED){
        if(ED=='day'||ED=='week'){
            document.getElementById('end').value = rdate.value;
        }else{
            var d = rdate.valueAsDate;
            if(ED=='mon'){
                d.setDate(1);
                d.setMonth(d.getMonth() +1);
                d.setDate(1-1);
            }
            let Mon = d.getMonth()+1;
            if(Mon<10){
                Mon = '0'+Mon;
            }
            let day = d.getDate();
            if(day<10){
                day = '0'+day;
            }
            document.getElementById('end').value = d.getFullYear()+'-'+Mon+'-'+day;
        }    
    }
    function start_mon(SM){
        var d = rdate.valueAsDate;
        if(SM=='quarter'){
            d.setDate(1);
            if(d.getMonth()<3){
                d.setMonth(1);
            }
            else if(d.getMonth()<6){
                d.setMonth(4);
            }
            else if(d.getMonth()<9){
                d.setMonth(7);
            }
            else{
                d.setMonth(10);
            }
            end_mon(d.getMonth()+2);
        }else if(SM=='Hyear'){
            if(d.getMonth()<6){
                d.setMonth(1);
            }else{
                d.setMonth(6);
            }
            end_mon(d.getMonth()+6);
        }else{
            d.setMonth(1);
            end_mon(12);
        }
        
        console.log(d);
        let Mon = d.getMonth();
        if(Mon<10){
            Mon = '0'+Mon;
        }
        document.getElementById('start').value = d.getFullYear()+'-'+Mon;
    }
        function end_mon(EM){
            var d = rdate.valueAsDate;
            let Mon = EM;
            if(Mon<10){
                Mon = '0'+Mon;
            }
            document.getElementById('end').value = d.getFullYear()+'-'+Mon;
        }
</script>
</html>
