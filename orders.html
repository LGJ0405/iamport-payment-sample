<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite 주문 내역 모니터링</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container { max-width: 800px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--card-border); text-align: left; }
        th { color: var(--text-muted); font-weight: 600; }
        .status-paid { color: var(--success); font-weight: 700; }
        .badge-pg { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <main class="container">
        <div class="card">
            <header class="header">
                <span class="header-badge">SQLite Database Monitoring</span>
                <h1>주문 내역 DB 목록</h1>
                <p>결제 성공 후 SQLite DB에 실시간 저장된 주문 데이터입니다.</p>
            </header>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a href="/" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">← 결제 페이지로 돌아가기</a>
                <button type="button" id="btn-refresh" class="btn-submit" style="width: auto; padding: 8px 16px; font-size: 0.85rem;">🔄 새로고침</button>
            </div>

            <div id="table-container">
                <p style="text-align: center; color: var(--text-muted); margin-top: 20px;">주문 내역을 불러오는 중...</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', loadOrders);
        document.getElementById('btn-refresh').addEventListener('click', loadOrders);

        function loadOrders() {
            fetch('/api/orders')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('table-container');
                    if (!data.success || !data.orders || data.orders.length === 0) {
                        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 30px;">저장된 주문 내역이 없습니다.</p>';
                        return;
                    }

                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>PG</th>
                                    <th>주문명</th>
                                    <th>금액</th>
                                    <th>구매자</th>
                                    <th>상태</th>
                                    <th>일시</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.orders.forEach(order => {
                        const pgLabel = order.pg_provider && order.pg_provider.includes('tosspay') ? '🔵 토스' : '🟡 카카오';
                        const date = order.created_at || '-';

                        html += `
                            <tr>
                                <td>#${order.id}</td>
                                <td><span class="badge-pg">${pgLabel}</span></td>
                                <td><strong>${escapeHtml(order.order_name)}</strong></td>
                                <td>${order.amount.toLocaleString()}원</td>
                                <td>${escapeHtml(order.buyer_name)} (${escapeHtml(order.buyer_tel || '-')})</td>
                                <td><span class="status-paid">${order.status}</span></td>
                                <td style="font-size: 0.75rem; color: var(--text-muted);">${date}</td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table>';
                    container.innerHTML = html;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('table-container').innerHTML = '<p style="color: var(--danger); text-align: center; margin-top: 20px;">서버 통신 실패 (node server.js 가 실행 중인지 확인하세요)</p>';
                });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
